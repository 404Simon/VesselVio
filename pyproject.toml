[project]
name = "vesselvio"
version = "0.1.0"
description = "An open-source application for analysis and visualization of segmented vasculature datasets"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Jacob Bumgarner", email = "jacobbum21@gmail.com" },
]
keywords = [
    "vasculature",
    "segmentation",
    "analysis",
    "visualization",
    "graph",
]

dependencies = [
    "geomdl>=5.4.0",
    "igraph>=1.0.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.9",
    "mcubes>=0.1.6",
    "nibabel>=5.4.2",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pre-commit>=4.6.0",
    "pyexcelerate>=0.13.0",
    "pyqt5>=5.15.11",
    "pyvista>=0.48.2",
    "pyvistaqt>=0.11.4",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://jacobbumgarner.github.io/VesselVio/"
Repository = "https://github.com/JacobBumgarner/VesselVio"

[project.scripts]
vesselvio = "VesselVio:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-datafiles>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
